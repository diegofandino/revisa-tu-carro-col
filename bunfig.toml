[install]
# Supply-chain guard: only install versions published at least 7 days ago.
minimumReleaseAge = 604800
# Exact versions when adding dependencies.
exact = true

[test]
# Unit tests live in src/; e2e/*.spec.ts are run by Playwright, not bun test.
root = "src"
coverageSkipTestFiles = true
coverageThreshold = { lines = 0.9, functions = 0.9 }
coveragePathIgnorePatterns = ["src/lib/supabase/**"]
